version: 2
updates:
  # npm — dev tooling only: this package has no runtime dependencies and no
  # committed lockfile, so updates land in package.json.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
    groups:
      npm-development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Held across the frontends until the 5.1 line: a dot-zero major seasons
      # first. Only 5.0.x is ignored, so the first 5.1 release still opens a PR.
      - dependency-name: 'vitest'
        versions:
          - '5.0.x'

  # GitHub Actions — pinned action versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
