name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # 22 is the oldest Node still in support; 24 is the LTS the consuming
    # apps now run on. Testing only the newest would leave consumers on 22
    # unverified. Node 18 is omitted despite engines.node — it went EOL in
    # April 2025.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Validate Package Structure
        run: |
          # Check that key files exist
          test -f index.js || { echo "Missing index.js"; exit 1; }
          test -f package.json || { echo "Missing package.json"; exit 1; }
          test -f README.md || { echo "Missing README.md"; exit 1; }
          echo "✅ Package structure validated"

      - name: Check package can be imported
        run: |
          # Set env vars to prevent main() from running
          export VITEST=true
          node --input-type=module -e "import('./index.js').then(() => console.log('✅ Package imported successfully'))"
