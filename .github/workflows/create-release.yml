name: Create Release & Publish

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  create-release:
    runs-on: ubuntu-24.04

    # Pushes the version commit to main and creates the release branch. Needed
    # for the `|| github.token` fallback when ACTIONS_TOKEN is unset.
    permissions:
      contents: write

    outputs:
      new_version: ${{ steps.new-version.outputs.new_version }}
      branch_name: ${{ steps.new-version.outputs.branch_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # ACTIONS_TOKEN required to push to protected main branch
          token: ${{ secrets.ACTIONS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new-version
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.current_version }}"
          VERSION_TYPE="${{ inputs.version_type }}"

          IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"

          case "$VERSION_TYPE" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          BRANCH_NAME="release/${NEW_VERSION}"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
          echo "Branch name: $BRANCH_NAME"

      - name: Check if branch already exists
        run: |
          BRANCH_NAME="${{ steps.new-version.outputs.branch_name }}"

          # Check if branch exists locally or remotely
          if git show-ref --verify --quiet refs/heads/$BRANCH_NAME || git show-ref --verify --quiet refs/remotes/origin/$BRANCH_NAME; then
            echo "❌ Branch $BRANCH_NAME already exists"
            exit 1
          else
            echo "✅ Branch $BRANCH_NAME does not exist, proceeding..."
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update main branch version
        run: |
          CURRENT_VERSION="${{ steps.current-version.outputs.current_version }}"
          NEW_VERSION="${{ steps.new-version.outputs.new_version }}"

          echo "Updating main branch version from $CURRENT_VERSION to $NEW_VERSION"

          # Update version in package.json
          npm version "$NEW_VERSION" --no-git-tag-version

          # server.json is the Official MCP Registry listing. Clients that install
          # from the registry run exactly the version it pins, so it moves with the
          # package in the same commit; the publish job lists it after the npm upload.
          node - "$NEW_VERSION" <<'JS'
          const fs = require('fs')
          const version = process.argv[2]
          const listing = JSON.parse(fs.readFileSync('server.json', 'utf8'))
          listing.version = version
          for (const pkg of listing.packages) pkg.version = version
          fs.writeFileSync('server.json', JSON.stringify(listing, null, 2) + '\n')
          JS

          # Commit and push to main
          git add package.json server.json
          git commit -m "Release v$NEW_VERSION"
          git push origin main

      - name: Create release branch
        run: |
          BRANCH_NAME="${{ steps.new-version.outputs.branch_name }}"

          echo "Creating release branch: $BRANCH_NAME"

          # Create new branch from updated main
          git checkout -b "$BRANCH_NAME"

          # Push the release branch
          git push origin "$BRANCH_NAME"

          echo "✅ Release branch created: $BRANCH_NAME"

  create-tag:
    needs: create-release
    permissions:
      contents: write
    uses: RoboFinSystems/robosystems/.github/workflows/tag-release.yml@main
    with:
      branch_ref: ${{ needs.create-release.outputs.branch_name }}
      product_name: 'RoboSystems MCP Bridge'
      project_kind: 'MCP bridge'
    secrets: inherit

  # npm's trusted publisher is pinned to this workflow file and the production
  # environment, whose protection rules (required reviewer, deployment
  # branches) gate every publish. The approval prompt lands on this run.
  publish:
    needs: [create-release, create-tag]
    runs-on: ubuntu-24.04
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.tag_name }}

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Verify the checkout is the released version
        run: |
          EXPECTED="${{ needs.create-release.outputs.new_version }}"
          ACTUAL="${{ steps.version.outputs.version }}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Checked out version $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "✅ Checked out the released version $ACTUAL"

      # Before anything irreversible: the registry listing must name this version
      # and this package. The create-release job bumps both together; a hand
      # edit could split them.
      - name: Check server.json matches the release
        run: |
          node - <<'JS'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const listing = JSON.parse(fs.readFileSync('server.json', 'utf8'))
          const versions = new Set([listing.version, ...listing.packages.map((p) => p.version)])
          if (versions.size !== 1 || !versions.has(pkg.version)) {
            throw new Error(`server.json pins ${[...versions]}, package.json releases ${pkg.version}`)
          }
          if (pkg.mcpName !== listing.name) {
            throw new Error(`package.json mcpName is ${pkg.mcpName}, server.json lists ${listing.name}`)
          }
          console.log(`server.json lists ${listing.name} ${pkg.version}`)
          JS

      # Pinned by version and checksum (the sha256 is the one in the release's
      # registry_1.8.1_checksums.txt), so a new publisher build never runs here
      # unreviewed. Installed outside the checkout, so it cannot reach the package.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mcp-publisher" --version

      # The registry's own validation, which needs no login. Run before the npm
      # upload: a version number is burned once published, and a listing the
      # registry rejects could not be published for it afterwards.
      - name: Validate server.json against the registry
        run: mcp-publisher validate server.json

      - name: Check if already published
        id: check-published
        run: |
          # Check if this version is already published to npm
          if npm view @robosystems/mcp@${{ steps.version.outputs.version }} version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} is already published"
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.version.outputs.version }} is not yet published"
          fi

      - name: Setup Node.js
        if: steps.check-published.outputs.already_published == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
        env:
          NODE_AUTH_TOKEN: ''  # Clear default token to use OIDC

      - name: Upgrade npm for OIDC support
        if: steps.check-published.outputs.already_published == 'false'
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        if: steps.check-published.outputs.already_published == 'false'
        run: npm install

      - name: Publish to npm
        if: steps.check-published.outputs.already_published == 'false'
        run: npm publish --provenance --access public

      # The Official MCP Registry validates an npm listing against the published
      # package (the version must exist and its package.json must carry the
      # matching mcpName), so wait until npm serves it. Runs on a re-run too.
      - name: Wait for npm to serve the release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for _ in $(seq 1 30); do
            if npm view "@robosystems/mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "npm serves @robosystems/mcp ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm did not serve @robosystems/mcp ${VERSION} within 5 minutes"
          exit 1

      # Clients that install from the registry run the version it pins, so a
      # release the registry does not list never reaches them. The ai.robosystems
      # namespace is proven by DNS on robosystems.ai; the key is a production
      # environment secret. Skips when this version is already listed, so the
      # listing is published at most once per release, and a re-run after the
      # npm upload succeeded still reaches it.
      - name: Publish to the MCP Registry
        env:
          MCP_REGISTRY_DOMAIN: robosystems.ai
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          NAME=$(node -p "require('./server.json').name")
          VERSION=$(node -p "require('./server.json').version")
          ENCODED=$(node -p "encodeURIComponent(process.argv[1])" "$NAME")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${ENCODED}/versions/${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "${NAME} ${VERSION} is already listed"
            exit 0
          fi
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set on the production environment, so ${NAME} ${VERSION} was not listed"
            exit 1
          fi
          mcp-publisher login dns --domain "$MCP_REGISTRY_DOMAIN" --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          mcp-publisher publish server.json
          echo "Listed ${NAME} ${VERSION} on the Official MCP Registry"

      - name: Create summary
        if: steps.check-published.outputs.already_published == 'false'
        run: |
          echo "## 📦 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** [@robosystems/mcp](https://www.npmjs.com/package/@robosystems/mcp)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npm install @robosystems/mcp@${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create-summary:
    needs: [create-release, create-tag, publish]
    if: always()
    runs-on: ubuntu-24.04

    # Only writes to $GITHUB_STEP_SUMMARY; needs no token scopes at all.
    permissions: {}
    steps:
      - name: Create summary
        run: |
          echo "## 🚀 SDK Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.create-tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ needs.create-tag.outputs.tag_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ needs.create-release.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Publish:** ${{ needs.publish.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** ${{ needs.create-tag.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The version and tag are cut but the package is not on npm or not listed on the MCP Registry. Fix the cause, then **Re-run failed jobs** on this run; a new release is only needed when the code itself is at fault." >> $GITHUB_STEP_SUMMARY
          fi
